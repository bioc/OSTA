name: biocbook

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["dependencies"]
    types:
      - completed
    branches:
      - devel
      - devel-*
      - RELEASE_**
      - sandbox
      - sandbox-*
  push:
    branches:
      - devel
      - devel-*
      - RELEASE_**
      - sandbox
      - sandbox-*
    paths-ignore:
      - 'README.md' 
      - 'deps.Dockerfile'
      - 'DESCRIPTION'

env:
  BUILD_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # Only run if triggered by push/workflow_dispatch, or if triggered by workflow_run and the previous workflow succeeded
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    name: build-book (${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }})
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free root space
        uses: almahmoud/free-root-space@main
        with:
          verbose: true
      
      - name: 🧾 Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: 🏷 Set Bioc version
        run: |
          branch="${BUILD_BRANCH}"
          if [[ "$branch" == "devel" || "$branch" =~ ^RELEASE_ ]]; then
            # Remove everything after and including '-' if present
            version=${branch%%-*}
            echo "BIOC_VERSION=${version}" >> "${GITHUB_ENV}"
          else
            echo "BIOC_VERSION=devel" >> "${GITHUB_ENV}"
          fi

      # Disabled until a Node 24-compatible telemetry action is available.
      # - name: ⏳ Collect Workflow Telemetry
      #   uses: catchpoint/workflow-telemetry-action@v2

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
  
      - name: 📝 Get book info
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          Pkgname=$(grep -m1 -E '^Package: +' DESCRIPTION | sed -E 's/.*: +//')
          echo Pkgname=${Pkgname} >> "${GITHUB_ENV}"
          pkgname=${Pkgname,,}
          echo pkgname=${pkgname} >> "${GITHUB_ENV}"
          owner=${OWNER,,}
          echo owner=${owner} >> "${GITHUB_ENV}"
          echo pkgversion=$(grep -m1 -E '^Version: +' DESCRIPTION | sed -E 's/.*: +//') >> "${GITHUB_ENV}"

      - name: 🔐 Log in to the Github Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷 Get metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.owner }}/${{ env.pkgname }}
          tags: |
            type=raw,value=${{ env.BUILD_BRANCH }}

      - name: 📦 Build and push book image
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: biocbook.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BRANCH=${{ steps.meta.outputs.version }}
            OWNER=${{ env.owner }}

      - name: 📚 Recover pkg artifacts generated during build in local Docker container (pkg bundle and book) 
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.docker.outputs.digest }}
          PACKAGE_NAME: ${{ env.Pkgname }}
          PACKAGE_VERSION: ${{ env.pkgversion }}
        run: |
          IMG_REF="${IMAGE_TAG}@${IMAGE_DIGEST}"
          docker pull "${IMG_REF}"
          container_id=$(docker container create "${IMG_REF}")
          trap 'docker container rm "${container_id}" >/dev/null' EXIT
          docker container cp "${container_id}:/opt/pkg/${PACKAGE_NAME}_${PACKAGE_VERSION}.tar.gz" .
          tar --extract --gzip --file "${PACKAGE_NAME}_${PACKAGE_VERSION}.tar.gz"
          echo "bundle_path=${PACKAGE_NAME}_${PACKAGE_VERSION}.tar.gz" >> "${GITHUB_ENV}"
          echo "book_path=${PACKAGE_NAME}/inst/doc/book/" >> "${GITHUB_ENV}"

      - name: 🏷 Get gh-branch directory to deploy to
        run: |
          echo target_folder=$(echo ${{ env.BIOC_VERSION }} | sed 's,RELEASE_,,' | tr '_' '.') >> "${GITHUB_ENV}"

      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.book_path }}/

      - name: 💾 Upload package bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: ${{ env.bundle_path }}

  deploy:
    # Only deploy for sandbox, regardless of whether this was a push or a workflow_run
    if: >
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/sandbox')
      || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'sandbox')
    needs: build

    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
